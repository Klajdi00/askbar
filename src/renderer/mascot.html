<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>AskBar mascot</title>
    <link rel="stylesheet" href="mascot.css" />
  </head>
  <body>
    <div id="mascot" data-state="idle" data-character="mochi" title="Click to ask, hold and drag to move, right-click for options">
      <!--
        The built-in mascots (Mochi, Bolt, Boo) are original artwork made for
        this project and released under the project's AGPL-3.0 licence.

        Each character uses the same class names, so the shared state rules in
        mascot.css work for all of them: .figure, .eyes/.eye, .happy-eyes,
        .mouth-idle/-thinking/-done/-surprised, optional .tongue.
        To add a character: draw a 96x96 SVG with those classes, give it
        class="art art-<id>", and add <id> to src/config/mascots.js.
      -->

      <!-- Mochi, the kitten -->
      <svg class="art art-mochi" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe2bd" />
            <stop offset="1" stop-color="#ffbb7a" />
          </linearGradient>
        </defs>
        <ellipse class="shadow" cx="48" cy="90.5" rx="24" ry="3.5" />
        <g class="figure">
          <g class="tail">
            <path class="tail-line" d="M72 79 C86 82 92 68 89 58 C87 52 89 47 92.5 47.5" />
            <path class="tail-fill" d="M72 79 C86 82 92 68 89 58 C87 52 89 47 92.5 47.5" />
          </g>
          <g class="ear ear-left">
            <path class="fur" d="M21 46 L24.5 18.5 Q25.5 15 28.5 17 L46 31 Z" />
            <path class="ear-in" d="M26.5 37 L27.8 23 L38 30.5 Z" />
          </g>
          <g class="ear ear-right">
            <path class="fur" d="M75 46 L71.5 18.5 Q70.5 15 67.5 17 L50 31 Z" />
            <path class="ear-in" d="M69.5 37 L68.2 23 L58 30.5 Z" />
          </g>
          <path class="fur body" d="M14 64 C14 40 28 27 48 27 C68 27 82 40 82 64 C82 80 68 87 48 87 C28 87 14 80 14 64 Z" />
          <ellipse class="belly" cx="48" cy="75" rx="17" ry="9.5" />
          <g class="whiskers">
            <path d="M19 60.5 L8 58.5" />
            <path d="M19 64.5 L8.5 66.5" />
            <path d="M77 60.5 L88 58.5" />
            <path d="M77 64.5 L87.5 66.5" />
          </g>
          <g class="eyes">
            <g class="eye">
              <ellipse cx="36" cy="55" rx="5.2" ry="6.2" />
              <circle class="shine" cx="38" cy="52.6" r="2" />
              <circle class="shine" cx="34.6" cy="57.6" r="0.9" />
            </g>
            <g class="eye">
              <ellipse cx="60" cy="55" rx="5.2" ry="6.2" />
              <circle class="shine" cx="62" cy="52.6" r="2" />
              <circle class="shine" cx="58.6" cy="57.6" r="0.9" />
            </g>
          </g>
          <g class="happy-eyes">
            <path d="M31 56.5 q5 -6.5 10 0" />
            <path d="M55 56.5 q5 -6.5 10 0" />
          </g>
          <ellipse class="cheek" cx="27" cy="63.5" rx="4.2" ry="2.6" />
          <ellipse class="cheek" cx="69" cy="63.5" rx="4.2" ry="2.6" />
          <path class="nose" d="M46 60 h4 l-2 2.3 z" />
          <path class="tongue" d="M46.4 63.6 h3.2 v2.5 a1.6 1.6 0 0 1 -3.2 0 z" />
          <path class="mouth mouth-idle" d="M43.5 63.2 q2.25 2.8 4.5 0 q2.25 2.8 4.5 0" />
          <path class="mouth mouth-thinking" d="M44.5 64.2 q1.75 -1.6 3.5 0 q1.75 1.6 3.5 0" />
          <path class="mouth mouth-done" d="M43 62.6 q5 7.5 10 0 z" />
          <circle class="mouth mouth-surprised" cx="48" cy="65" r="2.3" />
          <ellipse class="fur paw" cx="37" cy="85" rx="6.5" ry="4" />
          <ellipse class="fur paw" cx="59" cy="85" rx="6.5" ry="4" />
        </g>
      </svg>

      <!-- Bolt, the robot -->
      <svg class="art art-bolt" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#8f94fb" />
            <stop offset="1" stop-color="#4f46e5" />
          </linearGradient>
        </defs>
        <ellipse class="shadow" cx="48" cy="90" rx="22" ry="3.5" />
        <g class="figure">
          <rect class="foot" x="31" y="80" width="11" height="8" rx="4" />
          <rect class="foot" x="54" y="80" width="11" height="8" rx="4" />
          <ellipse class="arm arm-left" cx="14.5" cy="60" rx="4.5" ry="7.5" />
          <ellipse class="arm arm-right" cx="81.5" cy="60" rx="4.5" ry="7.5" />
          <g class="antenna">
            <path d="M48 24 V13" />
            <circle class="antenna-ball" cx="48" cy="10" r="4.5" />
          </g>
          <rect class="body" x="14" y="22" width="68" height="62" rx="29" />
          <rect class="face" x="24" y="35" width="48" height="29" rx="14.5" />
          <g class="eyes">
            <ellipse class="eye" cx="39" cy="49" rx="3.6" ry="4.6" />
            <ellipse class="eye" cx="57" cy="49" rx="3.6" ry="4.6" />
          </g>
          <g class="happy-eyes">
            <path d="M35 50.5 q4 -6 8 0" />
            <path d="M53 50.5 q4 -6 8 0" />
          </g>
          <circle class="cheek" cx="31" cy="56" r="2.8" />
          <circle class="cheek" cx="65" cy="56" r="2.8" />
          <path class="mouth mouth-idle" d="M44 57 q4 3 8 0" />
          <path class="mouth mouth-thinking" d="M45 58 h6" />
          <path class="mouth mouth-done" d="M42.5 56 q5.5 6 11 0" />
          <circle class="mouth mouth-surprised" cx="48" cy="58" r="2.2" />
        </g>
      </svg>

      <!-- Boo, the ghost -->
      <svg class="art art-boo" viewBox="0 0 96 96" aria-hidden="true">
        <defs>
          <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset="1" stop-color="#e2ddff" />
          </linearGradient>
        </defs>
        <ellipse class="shadow" cx="48" cy="90.5" rx="18" ry="3" />
        <g class="figure">
          <ellipse class="arm arm-left" cx="20.5" cy="56" rx="5" ry="7" />
          <ellipse class="arm arm-right" cx="75.5" cy="56" rx="5" ry="7" />
          <path
            class="body"
            d="M23 48 C23 28 34 15 48 15 C62 15 73 28 73 48 V78 q-4.17 6 -8.33 0 q-4.17 -6 -8.33 0 q-4.17 6 -8.33 0 q-4.17 -6 -8.33 0 q-4.17 6 -8.33 0 q-4.17 -6 -8.33 0 Z"
          />
          <g class="eyes">
            <g class="eye">
              <ellipse cx="39" cy="45" rx="5" ry="6.5" />
              <circle class="shine" cx="41" cy="42.4" r="1.9" />
            </g>
            <g class="eye">
              <ellipse cx="57" cy="45" rx="5" ry="6.5" />
              <circle class="shine" cx="59" cy="42.4" r="1.9" />
            </g>
          </g>
          <g class="happy-eyes">
            <path d="M34 46.5 q5 -6.5 10 0" />
            <path d="M52 46.5 q5 -6.5 10 0" />
          </g>
          <ellipse class="cheek" cx="31" cy="53" rx="4" ry="2.5" />
          <ellipse class="cheek" cx="65" cy="53" rx="4" ry="2.5" />
          <path class="tongue" d="M46.4 56 h3.2 v2.6 a1.6 1.6 0 0 1 -3.2 0 z" />
          <path class="mouth mouth-idle" d="M44 54.5 q4 3.5 8 0" />
          <path class="mouth mouth-thinking" d="M44.5 56 q1.75 -1.6 3.5 0 q1.75 1.6 3.5 0" />
          <path class="mouth mouth-done" d="M43 54 q5 8 10 0 z" />
          <ellipse class="mouth mouth-surprised" cx="48" cy="57" rx="2.6" ry="3.2" />
        </g>
      </svg>

      <!-- Your own image (from Settings → Mascot) -->
      <img class="art art-custom" id="custom" alt="" draggable="false" />

      <!-- Shared reactions for every mascot -->
      <svg class="overlay" viewBox="0 0 96 96" aria-hidden="true">
        <g class="dots">
          <circle cx="71" cy="16" r="2.2" />
          <circle cx="78" cy="10.5" r="2.8" />
          <circle cx="86.5" cy="5" r="3.4" />
        </g>
        <g class="sparkles">
          <path d="M12 18 Q12 24 18 24 Q12 24 12 30 Q12 24 6 24 Q12 24 12 18 Z" />
          <path d="M86 26 Q86 31 91 31 Q86 31 86 36 Q86 31 81 31 Q86 31 86 26 Z" />
          <path d="M78 6 Q78 9.5 81.5 9.5 Q78 9.5 78 13 Q78 9.5 74.5 9.5 Q78 9.5 78 6 Z" />
        </g>
      </svg>

      <button id="look" type="button" title="Look at screen: attach a screenshot to your next question">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M1.8 10s3-5.5 8.2-5.5S18.2 10 18.2 10s-3 5.5-8.2 5.5S1.8 10 1.8 10Z" />
          <circle cx="10" cy="10" r="2.6" />
        </svg>
      </button>
    </div>

    <script src="mascot.js"></script>
  </body>
</html>
