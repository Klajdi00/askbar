<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The page itself makes no network requests: AI calls happen in the main process. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>AskBar</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="card">
      <div id="bar">
        <span class="badge" title="AI assistant">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5c.3 2.9 1.6 4.2 4.5 4.5-2.9.3-4.2 1.6-4.5 4.5C7.7 7.6 6.4 6.3 3.5 6 6.4 5.7 7.7 4.4 8 1.5Zm4.2 8.3c.15 1.3.75 1.9 2.05 2.05-1.3.15-1.9.75-2.05 2.05-.15-1.3-.75-1.9-2.05-2.05 1.3-.15 1.9-.75 2.05-2.05Z"/></svg>
          <span>AI</span>
        </span>
        <textarea id="prompt" rows="1" placeholder="Ask anything…" spellcheck="false" autocomplete="off" aria-label="Ask the AI"></textarea>
        <button id="btn-screen" class="icon" type="button" title="Attach a screenshot of this screen">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="10" rx="1.5"/><path d="M7 16.5h6M10 13.5v3"/></svg>
        </button>
        <button id="btn-settings" class="icon" type="button" title="Settings (Ctrl+,)">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.55 1.55M13.75 13.75l1.55 1.55M4.7 15.3l1.55-1.55M13.75 6.25l1.55-1.55"/></svg>
        </button>
      </div>

      <div id="attachment" hidden>
        <div class="chip">
          <img id="shot-thumb" alt="Screenshot preview" />
          <span id="shot-label">Screenshot attached</span>
          <button id="shot-remove" class="chip-x" type="button" title="Remove screenshot">✕</button>
        </div>
        <span id="shot-warning" class="hint" hidden>Redact mode covers text only. The screenshot is sent as is.</span>
      </div>

      <section id="chat" hidden></section>

      <section id="settings" hidden>
        <div class="settings-head">
          <h2>Settings</h2>
          <span id="app-version" class="hint"></span>
        </div>
        <div id="settings-notice" class="notice" hidden></div>

        <div class="grid">
          <label class="field">
            <span class="label">Provider</span>
            <select id="set-provider"></select>
          </label>
          <label class="field">
            <span class="label">Model</span>
            <input id="set-model" list="model-list" spellcheck="false" autocomplete="off" />
            <datalist id="model-list"></datalist>
          </label>
        </div>

        <div class="field">
          <span class="label">API key</span>
          <div class="row">
            <input id="set-key" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your API key" />
            <button id="key-remove" class="ghost" type="button">Remove</button>
          </div>
          <span class="hint"><span id="key-status"></span> <a href="#" id="key-get">Get a key</a></span>
          <span class="hint" id="privacy-line"></span>
        </div>

        <div class="checks">
          <label class="check">
            <input type="checkbox" id="set-redact" />
            <span>Redact mode <span class="hint">Mask emails, long numbers and IBANs before sending. Text only.</span></span>
          </label>
          <label class="check">
            <input type="checkbox" id="set-blur" />
            <span>Close when clicking outside</span>
          </label>
          <label class="check">
            <input type="checkbox" id="set-login" />
            <span>Start on login <span id="login-hint" class="hint"></span></span>
          </label>
        </div>

        <div class="field">
          <span class="label">Shortcuts <span class="hint">Click a box, then press the keys. Backspace clears.</span></span>
          <div id="hotkeys" class="hotkeys"></div>
        </div>

        <label class="field">
          <span class="label">Clipboard rewrite instruction</span>
          <textarea id="set-instruction" rows="2" spellcheck="false"></textarea>
        </label>

        <div id="settings-errors" class="error" hidden></div>

        <div class="actions">
          <button id="set-cancel" class="ghost" type="button">Cancel</button>
          <button id="set-save" class="primary" type="button">Save</button>
        </div>
      </section>

      <footer id="footer" hidden>
        <span id="status"></span>
        <span class="keys"><kbd>Enter</kbd> send <kbd>Ctrl+N</kbd> new chat <kbd>Esc</kbd> close</span>
      </footer>
    </main>

    <script src="markdown.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
